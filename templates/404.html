<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 — Page Not Found | Sahil Panwar</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ----- design tokens (consistent with base but self-contained) ----- */
    :root {
      --primary: #e63946;
      --primary-rgb: 230, 57, 70;
      --text1: #1a1a1a;
      --text2: #4a4a4a;
      --text3: #6c6c6c;
      --bg: #fafafa;
      --card-bg: #ffffff;
      --border: #eaeaea;
      --nav-h: 4.5rem;
      --font-display: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --transition: 0.25s ease;
      --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.02);
    }

    /* dark mode friendly – optional, but keeps contrast nice */
    @media (prefers-color-scheme: dark) {
      :root {
        --text1: #f0f0f0;
        --text2: #c0c0c0;
        --text3: #a0a0a0;
        --bg: #121212;
        --card-bg: #1e1e1e;
        --border: #2e2e2e;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text1);
      font-family: var(--font-display);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ----- base nav placeholder (mimics base.html nav) ----- */
    .nav-placeholder {
      height: var(--nav-h);
      width: 100%;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: var(--shadow-sm);
    }

    .nav-placeholder span {
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
      color: var(--primary);
    }

    /* ----- error page – improved & fully responsive ----- */
    .error-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem 4rem;
      position: relative;
      overflow: hidden;
      min-height: calc(100vh - var(--nav-h));
      min-height: calc(100dvh - var(--nav-h));
    }

    /* soft radial background */
    .error-page::before {
      content: "";
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(280px, 70vw, 800px);
      height: clamp(280px, 70vw, 800px);
      background: radial-gradient(circle, rgba(var(--primary-rgb), 0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .error-inner {
      text-align: center;
      max-width: 620px;
      width: 100%;
      position: relative;
      z-index: 2;
      animation: err-fade-up 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    }

    @keyframes err-fade-up {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ----- 404 number with gradient fill & stroke (fully responsive) ----- */
    .error-code {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(5.5rem, 24vw, 12rem);
      line-height: 0.95;
      letter-spacing: 0.02em;
      color: transparent;
      -webkit-text-stroke: 2px rgba(var(--primary-rgb), 0.3);
      text-stroke: 2px rgba(var(--primary-rgb), 0.3);
      position: relative;
      user-select: none;
      display: inline-block;
      margin-bottom: 0.25rem;
      filter: drop-shadow(0 4px 12px rgba(var(--primary-rgb), 0.08));
    }

    .error-code::after {
      content: "404";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--primary) 0%, rgba(var(--primary-rgb), 0.55) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke: 0;
      text-stroke: 0;
      z-index: 2;
    }

    /* subtle glow behind number */
    .error-code::before {
      content: "";
      position: absolute;
      inset: 10% 0;
      background: radial-gradient(circle, rgba(var(--primary-rgb), 0.15) 0%, transparent 70%);
      filter: blur(20px);
      z-index: 0;
      opacity: 0.6;
    }

    /* ----- icon with pulse (slightly refined) ----- */
    .error-icon {
      width: clamp(56px, 14vw, 76px);
      height: clamp(56px, 14vw, 76px);
      border-radius: 50%;
      background: rgba(var(--primary-rgb), 0.1);
      border: 1.5px solid rgba(var(--primary-rgb), 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0.5rem auto 1.75rem;
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: var(--primary);
      animation: err-pulse 2.8s ease-in-out infinite;
      backdrop-filter: blur(2px);
      transition: transform 0.2s;
    }

    .error-icon:hover {
      transform: scale(1.03);
    }

    @keyframes err-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(var(--primary-rgb), 0.2); }
      50%       { box-shadow: 0 0 0 16px rgba(var(--primary-rgb), 0); }
    }

    /* ----- text elements with better spacing & readability ----- */
    .error-eyebrow {
      color: var(--primary);
      font-size: clamp(0.72rem, 1.8vw, 0.88rem);
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 0.65rem;
      opacity: 0.9;
    }

    .error-title {
      font-size: clamp(1.5rem, 5vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.85rem;
      line-height: 1.2;
      color: var(--text1);
    }

    .error-desc {
      color: var(--text2);
      font-size: clamp(0.95rem, 2.2vw, 1.1rem);
      line-height: 1.7;
      margin-bottom: 2.2rem;
      max-width: 480px;
      margin-inline: auto;
      font-weight: 400;
    }

    /* ----- action buttons – fully responsive & touch friendly ----- */
    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2.8rem;
      padding: 0 0.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.85rem 1.8rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: clamp(0.9rem, 2vw, 1rem);
      letter-spacing: 0.01em;
      transition: all var(--transition);
      cursor: pointer;
      border: 1.5px solid transparent;
      text-decoration: none;
      line-height: 1.2;
      white-space: nowrap;
      min-height: 52px;
      flex: 0 1 auto;
    }

    .btn i {
      font-size: 1rem;
      transition: transform 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 8px 18px -6px rgba(var(--primary-rgb), 0.3);
    }

    .btn-primary:hover {
      background: #c42e3a;
      border-color: #c42e3a;
      transform: translateY(-2px);
      box-shadow: 0 14px 24px -8px rgba(var(--primary-rgb), 0.4);
    }

    .btn-primary:hover i {
      transform: translateX(3px);
    }

    .btn-outline {
      background: transparent;
      color: var(--text1);
      border-color: var(--border);
      box-shadow: var(--shadow-sm);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(var(--primary-rgb), 0.04);
      transform: translateY(-2px);
    }

    .btn-outline:hover i {
      transform: translateX(3px);
    }

    /* ----- quick links row – cleaner & wraps gracefully ----- */
    .error-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.75rem 1.75rem;
      padding-top: 1.8rem;
      border-top: 1px solid var(--border);
      margin-top: 0.5rem;
    }

    .error-links a {
      color: var(--text3);
      font-size: clamp(0.8rem, 1.8vw, 0.9rem);
      font-weight: 500;
      transition: color var(--transition), transform 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      text-decoration: none;
      padding: 0.25rem 0;
      border-bottom: 1px solid transparent;
    }

    .error-links a i {
      font-size: 0.85rem;
      color: var(--primary);
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .error-links a:hover {
      color: var(--primary);
      transform: translateY(-1px);
    }

    .error-links a:hover i {
      opacity: 1;
    }

    /* ----- fine-tune for small devices (mobile) ----- */
    @media (max-width: 520px) {
      .error-page {
        padding: 1.5rem 1rem 3.5rem;
        align-items: flex-start;
        padding-top: 3rem;
      }

      .error-actions {
        flex-direction: column;
        align-items: stretch;
        gap: 0.85rem;
        margin-bottom: 2.2rem;
      }

      .btn {
        width: 100%;
        justify-content: center;
        padding: 0.9rem 1.5rem;
      }

      .error-links {
        gap: 0.6rem 1.2rem;
        padding-top: 1.5rem;
      }

      .error-links a {
        font-size: 0.78rem;
        gap: 0.3rem;
      }
    }

    /* ----- very small phones (<=360px) ----- */
    @media (max-width: 360px) {
      .error-code {
        font-size: 4.8rem;
      }

      .error-icon {
        width: 48px;
        height: 48px;
        font-size: 1.2rem;
      }

      .error-title {
        font-size: 1.35rem;
      }

      .error-desc {
        font-size: 0.85rem;
      }

      .error-links a {
        font-size: 0.7rem;
      }
    }

    /* reduce motion if requested */
    @media (prefers-reduced-motion: reduce) {
      .error-inner {
        animation: none;
      }
      .error-icon {
        animation: none;
      }
      .btn, .error-links a {
        transition: none;
      }
      .btn:hover {
        transform: none;
      }
    }

    /* accessibility outline */
    .btn:focus-visible,
    .error-links a:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- simple nav placeholder – mimics base.html nav -->
  <div class="nav-placeholder">
    <span>Sahil Panwar</span>
  </div>

  <!-- 404 error section – improved css & fully responsive -->
  <section class="error-page">
    <div class="error-inner">

      <!-- 404 large number with gradient fill -->
      <div class="error-code" aria-hidden="true">404</div>

      <!-- icon with dumbbell (fitness theme) -->
      <div class="error-icon" aria-hidden="true">
        <i class="fas fa-dumbbell"></i>
      </div>

      <!-- eyebrow -->
      <p class="error-eyebrow">Oops — Wrong Rep</p>

      <!-- title -->
      <h1 class="error-title">Page Not Found</h1>

      <!-- description -->
      <p class="error-desc">
        Looks like this page skipped leg day and disappeared.
        Let's get you back on track.
      </p>

      <!-- action buttons -->
      <div class="error-actions">
        <a href="#" class="btn btn-primary">
          <i class="fas fa-home"></i> Back to Home
        </a>
        <a href="#" class="btn btn-outline">
          <i class="fas fa-envelope"></i> Contact Me
        </a>
      </div>

      <!-- quick links -->
      <div class="error-links">
        <a href="#"><i class="fas fa-bolt"></i> Services</a>
        <a href="#"><i class="fas fa-images"></i> Results</a>
        <a href="#"><i class="fas fa-newspaper"></i> Blog</a>
        <a href="#"><i class="fas fa-camera"></i> Gallery</a>
        <a href="#"><i class="fas fa-user"></i> Client Portal</a>
      </div>

    </div>
  </section>

</body>
</html>
